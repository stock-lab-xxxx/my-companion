ne;transition:none}}</style></head><body><main class="wrap"><h1>My Companion v0.9</h1><p class="sub">衣装は固定して、その衣装のまま表情・ポーズだけ変える</p><div class="stage"><img id="portrait" alt="女性キャラクター"><div class="overlay"><strong id="sceneTitle"></strong><span id="poseName"></span></div></div><section class="panel"><p class="sectiontitle">① 今日の服装・髪型を選ぶ</p><div class="btnrow" id="profiles"></div><div class="info" id="styleLine"></div></section><section class="panel"><p class="sectiontitle">② この服装のまま表情・ポーズを選ぶ</p><div class="btnrow" id="expressions"></div><div class="two"><button class="primary" id="play">自動スライド開始</button><button id="next">次のポーズへ</button></div><div class="status" id="status" role="status"></div><div class="info">自動切替は同じ服装の中だけ。別の服装へは移動しません。</div></section><p class="note">無料・AI未接続の動作実験版。おうちには「微笑み・笑顔・考え中」の3枚を収録。きれいめとリラックスは、同じ髪型・服装の表情差分を作る前なので、それぞれ1枚だけです。画像が空白にならないよう表示は単一画像で制御しています。</p></main>

let mode=0,expr=0,playing=false,timer=null,busy=false;
// Every frame is preloaded before any transition. Keep the old image if loading fails.
const cache=new Map();
for(const profile of profiles)for(const f of profile.frames){const image=new Image(); image.src=f.src;cache.set(f.src,image)}
function setStatus(message){el('status').textContent=message}
function drawButtons(){profileBox.replaceChildren();profiles.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.name;b.classList.toggle('active',i===mode);b.onclick=()=>chooseMode(i);profileBox.append(b)});exprBox.replaceChildren();profiles[mode].frames.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f.name;b.classList.toggle('active',i===expr);b.onclick=()=>changeExpression(i);exprBox.append(b)});el('styleLine').textContent='現在の衣装：'+profiles[mode].style;const one=profiles[mode].frames.length<2;el('play').disabled=one;el('next').disabled=one;el('play').style.opacity=one?'.45':'1';el('next').style.opacity=one?'.45':'1'}
async function show(){const scene=profiles[mode];const frame=scene.frames[expr];let img=cache.get(frame.src);if(!img){img=new Image();img.src=frame.src;cache.set(frame.src,img)}
if(img.decode){try{await img.decode()}catch(e){setStatus('画像が読み込めません。前の画像を保持します。');return}}
else if(!img.complete){await new Promise(resolve=>{img.onload=resolve;img.onerror=resolve})}
if(!img.naturalWidth){setStatus('画像の読み込みに失敗しました。');return}
portrait.classList.add('fading');await new Promise(resolve=>setTimeout(resolve,130));portrait.src=frame.src;portrait.classList.remove('fading');el('sceneTitle').textContent=scene.name+' ・ '+frame.name;el('poseName').textContent=frame.desc;drawButtons();setStatus((playing?'自動再生中：':'選択中：')+frame.name+'（'+(expr+1)+' / '+scene.frames.length+'）')}
async function changeExpression(index){if(busy)return;busy=true;expr=index;try{await show()}finally{busy=false}}
function stop(){playing=false;if(timer)clearInterval(timer);timer=null;el('play').textContent='自動スライド開始'}
async function chooseMode(index){stop();mode=index;expr=0;await show();if(profiles[index].frames.length===1)setStatus('この衣装は現在1枚のみ。差分は今後追加します。')}
function start(){if(profiles[mode].frames.length<2)return;playing=true;el('play').textContent='自動スライド停止';setStatus('同じ衣装の中で自動スライド中');if(timer)clearInterval(timer);timer=setInterval(()=>{if(!busy)changeExpression((expr+1)%profiles[mode].frames.length)},4200)}
el('play').onclick=()=>{if(playing){stop();setStatus('自動スライドを停止しました')}else start()};
el('next').onclick=()=>changeExpression((expr+1)%profiles[mode].frames.length);
portrait.src=profiles[0].frames[0].src;show();
</script></body></html>
