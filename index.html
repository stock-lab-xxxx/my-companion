<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7efeb">
<title>My Companion v0.7 — スライド実験</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
--ink:#3c302d;--muted:#7d6e68;--main:#aa7567}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:linear-gradient(#fffaf7,#f4e8e2)}
main{max-width:510px;margin:auto;padding:18px 14px 36px}
h1{font-size:19px;margin:0} .subtitle{font-size:12px;color:var(--muted);margin:5px 0 13px}
.stage{border-radius:22px;overflow:hidden;position:relative;aspect-ratio:1/1.12;
background:#d9c4b9;box-shadow:0 14px 32px #4e302022}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
transition:opacity 1.1s ease,transform 5s ease;transform:scale(1.045)}
.frame.active{opacity:1;transform:scale(1)}
.stage:after{content:"";position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#1e14149a);pointer-events:none}
.overlay{position:absolute;z-index:2;color:white;bottom:17px;left:18px;right:18px;text-shadow:0 2px 7px #0009}
.overlay strong{font-size:19px}.overlay p{font-size:12px;margin:5px 0 0}
.dot{width:8px;height:8px;border-radius:50%;background:#fff7;display:inline-block;margin-right:5px}
.dot.on{background:#80e9a9;box-shadow:0 0 8px #80e9a9}
.card{background:#fffcfb;border:1px solid #eaded8;border-radius:18px;padding:14px;margin-top:13px;box-shadow:0 5px 20px #6c433a0d}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border-radius:13px;border:1px solid #e5d3ca;padding:12px 8px;font-size:14px;
font-weight:600;background:white;color:var(--ink);cursor:pointer}
button.primary{background:#ad7968;color:white;border-color:#ad7968}
button.selected{border-color:#ad7968;background:#f6e5de}
button:active{opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
label{font-size:13px;color:var(--muted)}
select{border-radius:10px;border:1px solid #e4d4cd;padding:9px;background:white;font-size:14px}
.scene-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.scene-buttons button{font-size:12px;min-height:44px}
.note{font-size:12px;line-height:1.65;color:var(--muted);margin:12px 3px 0}
.status{font-size:12px;color:var(--muted);margin:10px 0 0}
</style></head>
<body><main>
<h1>My Companion <span style="color:#aa7567">v0.7</span></h1>
<p class="subtitle">静止画を自然に切り替える「スライド演出」体験版</p>
<div class="stage" id="stage">
<img class="frame active" id="frameA" alt="キャラクターのポーズ画像">
<img class="frame" id="frameB" alt="キャラクターの別ポーズ画像">
<div class="overlay"><strong id="title"></strong><p id="description"></p>
<p style="margin-top:9px"><i class="dot on" id="stateDot"></i><span id="state">自動スライド中</span></p></div>
</div>
<div class="card">
<div class="controls">
<button class="primary" id="autoBtn">自動切替を停止</button>
<button id="nextBtn">次の表情・ポーズ →</button>
</div>
<div class="scene-buttons" id="scenes"></div>
<div class="row" style="margin-top:13px">
<label for="speed">切替間隔</label>
<select id="speed"><option value="2500">2.5秒</option><option value="4500" selected>4.5秒</option><option value="7000">7秒</option></select>
</div>
<p class="status" id="status">読み込み中…</p>
</div>
<p class="note">この版は追加料金0円・外部サービス接続なし。3枚の静止画をフェードで切り替え、ゆっくり動いて見える演出を入れているよ。まだ口パク、まばたき、実際のAI音声会話は未実装。別のポーズに切り替わると髪型・服装も変わる実験版です。</p>
</main>

const state=document.getElementById('state'),stateDot=document.getElementById('stateDot');
let current=0,front=a,back=b,playing=true,timer=null,transitioning=false;
a.src=scenes[0].src;
b.src=scenes[0].src;
function repaint(){
  title.textContent=scenes[current].name;
  description.textContent=scenes[current].desc;
  status.textContent=`現在：${current+1} / ${scenes.length}｜${playing?'自動切替中':'手動切替中'}`;
  state.textContent=playing?'自動スライド中':'一時停止中';
  stateDot.classList.toggle('on',playing);
  autoBtn.textContent=playing?'自動切替を停止':'自動切替を再開';
  [...sceneButtons.children].forEach((btn,i)=>btn.classList.toggle('selected',i===current));
}
function show(index){
  if(transitioning)return;
  index=(index+scenes.length)%scenes.length;
  if(index===current)return;
  transitioning=true;
  current=index;
  back.src=scenes[current].src;
  back.style.transition='none';
  back.style.opacity='0';
  back.classList.remove('active');
  void back.offsetWidth;
  back.style.transition='';
  back.classList.add('active');
  front.classList.remove('active');
  const old=front;front=back;back=old;
  repaint();
  setTimeout(()=>{transitioning=false},1150);
}
function schedule(){
  clearInterval(timer);
  if(playing)timer=setInterval(()=>{if(!transitioning)show(current+1)},Number(speed.value));
}
scenes.forEach((scene,i)=>{
  const btn=document.createElement('button');btn.textContent=scene.name;
  btn.addEventListener('click',()=>{show(i);schedule()});
  sceneButtons.appendChild(btn);
});
autoBtn.addEventListener('click',()=>{playing=!playing;repaint();schedule()});
document.getElementById('nextBtn').addEventListener('click',()=>{show(current+1);schedule()});
speed.addEventListener('change',schedule);
repaint();schedule();
</script>
</body></html>
