<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7efeb">
<title>My Companion v1.0</title>
<style>
:root{
  --ink:#3e312d; --muted:#7b6b65; --line:#ead8cf; --accent:#ad7869; --bg1:#fff9f6; --bg2:#f2e6df;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100dvh;}
main{max-width:520px;margin:auto;padding:18px 14px 34px;}
.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px;}
.header h1{font-size:19px;margin:0;}
.sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;}
.badge{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 10px;white-space:nowrap;}
.stage{position:relative;overflow:hidden;border-radius:24px;aspect-ratio:0.87;background:#d7c2b8;box-shadow:0 18px 42px rgba(90,55,43,.16);}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;opacity:0;transition:opacity .65s ease, transform 3.5s ease;transform:scale(1.03)}
.frame.active{opacity:1;transform:scale(1)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(transparent, rgba(27,16,15,.74));pointer-events:none;}
.stage.talking .frame.active{animation:floatTalk 1.9s ease-in-out infinite alternate;}
.overlayTop{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;gap:10px;z-index:2;}
.pill{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border:1px solid #f0e1d8;border-radius:999px;padding:7px 10px;font-size:12px;color:#604a44;box-shadow:0 4px 12px rgba(80,50,40,.06);}
.overlayBottom{position:absolute;z-index:2;left:18px;right:18px;bottom:16px;color:white;text-shadow:0 2px 10px rgba(0,0,0,.36);}
.overlayBottom .title{font-size:20px;font-weight:700;margin-bottom:4px;}
.overlayBottom .desc{font-size:13px;line-height:1.45;opacity:.96;}
.live{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.15);padding:7px 10px;border-radius:999px;font-size:12px;}
.dot{width:9px;height:9px;border-radius:50%;background:#f5c7b2;}
.dot.on{background:#7fe0a7;box-shadow:0 0 0 0 rgba(127,224,167,.42);animation:pulse 1.5s infinite;}
.panel{margin-top:14px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 32px rgba(84,54,44,.05);}
.section{padding:14px;}
.section + .section{border-top:1px solid #efe0d7;}
.section h2{font-size:14px;margin:0 0 11px;color:#5d4640;}
.modeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
.modeBtn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 11px;text-align:left;box-shadow:0 5px 14px rgba(90,60,50,.04);}
.modeBtn.active{border-color:var(--accent);background:linear-gradient(180deg,#fff,#fcf6f2);box-shadow:0 8px 18px rgba(173,120,105,.14);}
.modeBtn .name{font-size:14px;font-weight:700;margin-bottom:3px;}
.modeBtn .meta{font-size:12px;color:var(--muted);line-height:1.4;}
.smallBtns{display:flex;gap:8px;flex-wrap:wrap;}
.actionBtn{appearance:none;border:none;border-radius:14px;padding:11px 13px;font-size:14px;font-weight:700;color:white;background:linear-gradient(180deg,#cf9f8b,#ad7869);box-shadow:0 8px 18px rgba(173,120,105,.24);}
.actionBtn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;}
.log{max-height:240px;overflow:auto;padding-right:2px;display:flex;flex-direction:column;gap:10px;}
.msg{display:flex;}
.msg.user{justify-content:flex-end;}
.bubble{max-width:84%;padding:10px 12px;border-radius:16px;line-height:1.55;font-size:14px;}
.msg.user .bubble{background:#f0ded6;color:#4b3932;border-bottom-right-radius:4px;}
.msg.ai .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}
.inputWrap{display:flex;gap:8px;margin-top:10px;}
.inputWrap input{flex:1;border-radius:14px;border:1px solid var(--line);padding:14px 14px;font-size:16px;background:#fff;color:var(--ink);}
.sendBtn{appearance:none;border:none;border-radius:14px;min-width:84px;padding:12px 12px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(180deg,#cf9f8b,#ad7869);box-shadow:0 8px 18px rgba(173,120,105,.24);}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px;}
.info{background:linear-gradient(180deg,#fff,#fdf8f5);border:1px solid var(--line);border-radius:16px;padding:12px;}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px;font-size:13px;line-height:1.45;}
.kv+.kv{margin-top:6px;}
.k{color:#8a7168;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,224,167,.42)}70%{box-shadow:0 0 0 8px rgba(127,224,167,0)}100%{box-shadow:0 0 0 0 rgba(127,224,167,0)}}
@keyframes floatTalk{0%{transform:scale(1.01) translateY(0)}50%{transform:scale(1.035) translateY(-2px)}100%{transform:scale(1.01) translateY(1px)}}
</style>
</head>
<body>
<main>
  <div class="header">
    <div>
      <h1>My Companion <span style="color:#ad7869">v1.0</span></h1>
      <div class="sub">おすすめ版：お家バージョンを強化。<br>同じ白ニット・まとめ髪のまま、表情モードを増やした試作版。</div>
    </div>
    <div class="badge">無料デモ / GitHub Pages対応</div>
  </div>

  <div class="stage" id="stage">
    <img class="frame active" id="frameA" alt="キャラクター画像A">
    <img class="frame" id="frameB" alt="キャラクター画像B">
    <div class="overlayTop">
      <div class="pill">お家バージョン固定</div>
      <div class="pill" id="modePill">通常</div>
    </div>
    <div class="overlayBottom">
      <div class="title" id="modeTitle">通常</div>
      <div class="desc" id="modeDesc">やさしく聞いてくれる穏やかな表情</div>
      <div class="live"><span class="dot" id="liveDot"></span><span id="liveText">待機中</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <h2>表情モード</h2>
        <div class="smallBtns">
          <button class="actionBtn secondary" id="autoBtn">おすすめ切替</button>
          <button class="actionBtn secondary" id="randomBtn">ランダム</button>
        </div>
      </div>
      <div class="modeGrid" id="modeGrid"></div>
    </div>

    <div class="section">
      <h2>今の設定</h2>
      <div class="info" id="info"></div>
    </div>

    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <h2>簡易会話デモ</h2>
        <button class="actionBtn secondary" id="demoBtn">デモ会話</button>
      </div>
      <div class="log" id="log"></div>
      <div class="inputWrap">
        <input id="input" type="text" placeholder="相談やひとことを入力">
        <button class="sendBtn" id="sendBtn">送信</button>
      </div>
      <div class="note">※ 本物のAI接続ではなく、簡易ロジックです。<br>※ 会話内容に応じて「通常・笑顔・考え中・共感・真剣」が切り替わります。</div>
    </div>
  </div>
</main>

const frameA = document.getElementById('frameA');
const frameB = document.getElementById('frameB');
const stage = document.getElementById('stage');
const modePill = document.getElementById('modePill');
const modeTitle = document.getElementById('modeTitle');
const modeDesc = document.getElementById('modeDesc');
const liveDot = document.getElementById('liveDot');
const liveText = document.getElementById('liveText');
const modeGrid = document.getElementById('modeGrid');
const info = document.getElementById('info');
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const demoBtn = document.getElementById('demoBtn');
const autoBtn = document.getElementById('autoBtn');
const randomBtn = document.getElementById('randomBtn');
let current = 0;
let front = frameA;
let back = frameB;
let autoMode = true;
let speaking = false;
let transitioning = false;

frameA.src = modes[0].src;
frameB.src = modes[0].src;

function updateInfo() {
  const m = modes[current];
  info.innerHTML = `
    <div class="kv"><div class="k">服装</div><div>白ニットで固定</div></div>
    <div class="kv"><div class="k">髪型</div><div>まとめ髪で固定</div></div>
    <div class="kv"><div class="k">モード</div><div>${m.name}</div></div>
    <div class="kv"><div class="k">表情</div><div>${m.desc}</div></div>`;
}

function renderButtons() {
  modeGrid.innerHTML = '';
  modes.forEach((m, idx) => {
    const btn = document.createElement('button');
    btn.className = 'modeBtn' + (idx===current ? ' active':'');
    btn.innerHTML = `<div class="name">${m.name}</div><div class="meta">${m.desc}</div>`;
    btn.addEventListener('click', () => { autoMode = false; refreshAutoLabel(); setMode(idx); });
    modeGrid.appendChild(btn);
  });
}

function refreshAutoLabel() {
  autoBtn.textContent = autoMode ? 'おすすめ切替ON' : 'おすすめ切替OFF';
}

function setLive(text, on=false) {
  liveText.textContent = text;
  liveDot.classList.toggle('on', on);
}

function setMode(idx) {
  idx = Math.max(0, Math.min(modes.length-1, idx));
  if (idx === current || transitioning) {
    current = idx;
    modePill.textContent = modes[current].name;
    modeTitle.textContent = modes[current].name;
    modeDesc.textContent = modes[current].desc;
    renderButtons();
    updateInfo();
    localStorage.setItem('myCompanionMode', String(current));
    return;
  }
  transitioning = true;
  current = idx;
  const next = modes[current];
  back.src = next.src;
  back.onload = () => {
    back.classList.add('active');
    front.classList.remove('active');
    const old = front; front = back; back = old;
    modePill.textContent = next.name;
    modeTitle.textContent = next.name;
    modeDesc.textContent = next.desc;
    renderButtons();
    updateInfo();
    localStorage.setItem('myCompanionMode', String(current));
    setTimeout(() => transitioning = false, 650);
  };
}

function inferMode(text) {
  const t = text.trim();
  if(/ありがとう|うれしい|楽しい|よかった|好き|最高|助かった/.test(t)) return 1; // smile
  if(/疲れ|しんどい|つらい|落ち込|悲しい|不安/.test(t)) return 3; // empathy
  if(/仕事|会社|上司|投資|株|お金|判断|決断|整理/.test(t)) return 4; // serious
  if(/どう思う|どうかな|考え|迷って|悩んで|相談/.test(t)) return 2; // thinking
  return 0;
}

function replyFor(text) {
  const t = text.trim();
  if(/ありがとう|うれしい|楽しい|よかった|好き|最高|助かった/.test(t)) return 'そう言ってもらえるとうれしいよ。いい流れだね。このままもう少し話してみようか。';
  if(/疲れ|しんどい|つらい|落ち込|悲しい|不安/.test(t)) return 'それはしんどかったね。無理に前向きにならなくていいから、まず今いちばん重い部分だけ一緒に整理しよう。';
  if(/仕事|会社|上司/.test(t)) return '仕事の相談だね。状況・相手・自分の希望に分けると見えやすいよ。まず何が一番引っかかってる？';
  if(/投資|株|お金|NISA/.test(t)) return 'お金の話だね。目的・期間・許容できるリスクを分けると、判断しやすくなるよ。';
  if(/どう思う|どうかな|考え|迷って|悩んで|相談/.test(t)) return 'うん、一緒に考えよう。結論を急がず、まずは選択肢を並べてみるところから始めようか。';
  if(/こんにちは|はじめまして/.test(t)) return 'こんにちは。今日はどんなことを話したい？ 相談でも雑談でも大丈夫だよ。';
  return 'ありがとう。ちゃんと聞いてるよ。続けて話してくれたら、整理するのを手伝うね。';
}

function speak(text) {
  if(!('speechSynthesis' in window)) return fakeSpeak(text);
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP'; utter.rate = 1.0; utter.pitch = 1.05;
  const voices = speechSynthesis.getVoices();
  const ja = voices.find(v => /ja-JP|Japanese/i.test(v.lang));
  if(ja) utter.voice = ja;
  utter.onstart = () => { stage.classList.add('talking'); setLive('話しています', true); };
  utter.onend = () => { stage.classList.remove('talking'); setLive('待機中', false); };
  utter.onerror = () => { stage.classList.remove('talking'); setLive('待機中', false); };
  speechSynthesis.speak(utter);
}

function fakeSpeak(text) {
  stage.classList.add('talking'); setLive('話しています', true);
  setTimeout(() => { stage.classList.remove('talking'); setLive('待機中', false); }, Math.min(5000, 60*text.length));
}

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function handleSend() {
  const text = input.value.trim();
  if(!text) return;
  addMessage('user', text);
  input.value = '';
  setLive('考えています', true);
  if(autoMode) setMode(inferMode(text));
  const reply = replyFor(text);
  setTimeout(() => { addMessage('ai', reply); speak(reply); }, 420);
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e => { if(e.key==='Enter') handleSend(); });
demoBtn.addEventListener('click', () => {
  const demos = ['最近ちょっと疲れてるかも。','仕事のことで少し迷っていて。','ありがとう、すごく助かった。','相談したいことがあるんだけど。'];
  const text = demos[Math.floor(Math.random()*demos.length)];
  addMessage('user', text);
  setLive('考えています', true);
  if(autoMode) setMode(inferMode(text));
  const reply = replyFor(text);
  setTimeout(() => { addMessage('ai', reply); speak(reply); }, 360);
});
autoBtn.addEventListener('click', () => { autoMode = !autoMode; refreshAutoLabel(); });
randomBtn.addEventListener('click', () => { autoMode = false; refreshAutoLabel(); setMode(Math.floor(Math.random()*modes.length)); });

(function init() {
  refreshAutoLabel();
  const saved = localStorage.getItem('myCompanionMode');
  const idx = saved !== null ? Math.max(0, Math.min(modes.length-1, Number(saved)||0)) : 0;
  setMode(idx);
  addMessage('ai', 'こんにちは。今回はお家バージョンを強化して、表情モードを増やしたよ。相談内容に応じて、おすすめの表情にも切り替わるよ。');
  setLive('待機中', false);
})();
</script>
</body>
