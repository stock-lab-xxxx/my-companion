le(1.055) translateY(-.3%)}}.box{background:#fff9;border:1px solid #e9d9d1;border-radius:18px;margin-top:12px;padding:12px}.sectiontitle{font-size:13px;font-weight:750;margin:0 0 8px}.outfits{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.look{border:2px solid transparent;border-radius:13px;background:#f8f0ec;padding:5px 5px 7px;display:block;color:#5b4540;font-size:11px;line-height:1.35;cursor:pointer}.look.selected{border-color:#a97566;background:#fff}.look img{display:block;width:100%;aspect-ratio:1.2;object-fit:cover;object-position:center 31%;border-radius:9px;margin-bottom:5px}.toggleline{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:13px}.toggleline input{width:19px;height:19px;accent-color:#aa7666}.hint{font-size:11px;color:#836f68;line-height:1.55;margin:7px 0 0}.chatlog{height:154px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:3px 0}.bubble{border-radius:13px;padding:10px 12px;font-size:13px;line-height:1.6;max-width:89%;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4e8e1;align-self:flex-start}.bubble.user{background:#dfc6bb;align-self:flex-end}.inputbar{display:flex;gap:7px;margin-top:11px}.inputbar input{width:100%;min-width:0;background:#fff;border:1px solid #dbc7bd;border-radius:12px;padding:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:750;cursor:pointer;background:#a97668;color:white;white-space:nowrap}.btn.secondary{background:#f4e8e1;color:#604941;border:1px solid #e3cfc5}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions .btn{flex:1;font-size:13px}.footer{font-size:11px;line-height:1.7;color:#866f66;margin:14px 4px}.toast{font-size:12px;color:#7a5547;min-height:20px;margin:6px 0 0}@media(prefers-reduced-motion:reduce){.photo,.orbit i{animation:none!important;transition:none!important}}
</style></head><body><main class="shell"><header class="heading"><h1>My Companion <span style="font-weight:400">v0.4</span></h1><span class="pill">無料・AI接続なし</span></header><section class="stage" id="stage"><img id="photoA" class="photo" alt="キャラクター"><img id="photoB" class="photo hidden" alt="キャラクター"><div class="shade"></div><div class="state"><strong id="stateTitle">こんにちは</strong><span id="stateSub">今日のスタイルでお出迎え</span></div><div class="orbit paused" id="orbit" aria-hidden="true"><i></i><i></i><i></i><i></i></div></section><section class="box"><p class="sectiontitle">今日のスタイル</p><div class="outfits" id="outfits"></div><label class="toggleline">日付で自動的に着せ替え <input type="checkbox" id="daily" checked></label><p class="hint">日替わりをオフにすると、好きな服装を固定できます。設定はこのiPhone内に保存を試みます。</p></section><section class="box"><p class="sectiontitle">会話のデモ</p><div class="chatlog" id="chatlog" role="log" aria-live="polite"></div><form class="inputbar" id="form"><input id="message" autocomplete="off" placeholder="こんにちは、などを入力" aria-label="メッセージ"><button class="btn" type="submit">送信</button></form><div class="actions"><button class="btn secondary" id="demo" type="button">声を聞く</button><button class="btn secondary" id="emotion" type="button">表情演出を試す</button><button class="btn secondary" id="stop" type="button">音声停止</button></div><div class="toast" id="toast" aria-live="polite"></div><p class="hint">声はiPhoneの読み上げ機能を利用します。音声が再生できない場合も、メッセージは画面に残ります。</p></section><p class="footer">これはアプリの雰囲気を試すための無料プロトタイプ。画像はゆっくり揺れ、会話中は少し動きますが、口や目そのものはまだ変化しません。本物のAIとの対話・音声認識・表情同期は未実装です。画像や会話は外部送信しません。</p></main><script>

const looks=["ニット・まとめ髪","ブラウス・ダウンヘア","カーディガン・ハーフアップ"];
const $=id=>document.getElementById(id);
function readPref(key,defaultValue){try{let x=localStorage.getItem(key);return x===null?defaultValue:x}catch(e){return defaultValue}}
function writePref(key,value){try{localStorage.setItem(key,String(value))}catch(e){}}
let daily=readPref('companion-daily','true')==='true';
let active=0,front=0,emotionNo=0,stopTimer=null;
const photos=[$('photoA'),$('photoB')];
function dayIndex(){let d=new Date();return (Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/86400000)%3+3)%3}
function showLook(idx,initial=false){idx=Math.max(0,Math.min(2,idx));active=idx;if(initial){photos[0].src=pictures[idx];photos[1].src=pictures[idx]}else{let back=1-front;photos[back].src=pictures[idx];photos[back].classList.remove('hidden');photos[front].classList.add('hidden');front=back}const buttons=[...document.querySelectorAll('.look')];buttons.forEach((b,i)=>{b.classList.toggle('selected',i===idx);b.setAttribute('aria-pressed',i===idx?'true':'false')});$('stateSub').textContent=looks[idx];if(!daily)writePref('companion-look',idx)}
function setup(){const outfits=$('outfits');looks.forEach((look,i)=>{let b=document.createElement('button');b.className='look';b.type='button';b.setAttribute('aria-label',look);const img=document.createElement('img');img.src=pictures[i];img.alt='';b.appendChild(img);b.appendChild(document.createTextNode(look));b.addEventListener('click',()=>{daily=false;$('daily').checked=false;writePref('companion-daily','false');showLook(i)});outfits.appendChild(b)});$('daily').checked=daily;const saved=Number(readPref('companion-look','0'));showLook(daily?dayIndex():(Number.isFinite(saved)?saved:0),true);addBubble('ai','こんにちは！今日はどんな話をしようか？');$('toast').textContent='表示準備OK。送信ボタンを試してね。'}
function addBubble(kind,text){const b=document.createElement('div');b.className='bubble '+kind;b.textContent=text;$('chatlog').appendChild(b);$('chatlog').scrollTop=$('chatlog').scrollHeight;return b}
function getReply(t){if(/仕事|職場|会社/.test(t))return '仕事の相談なんだね。今いちばん気になっていることを教えて。';if(/投資|株|お金/.test(t))return 'お金や投資のことだね。目的やリスクを整理して考えたいね。';if(/疲れ|眠い|しんどい/.test(t))return 'お疲れさま。無理しすぎず、休める時間も大切にしてね。';if(/こんにちは|おはよう|こんばんは/.test(t))return 'こんにちは！今日も話せてうれしいよ。';return 'うん、聞いているよ。もう少し詳しく話してみて。'}
function setSpeak(flag){$('stage').classList.toggle('talking',flag);$('orbit').classList.toggle('paused',!flag);$('stateTitle').textContent=flag?'話しています':'こんにちは'}
function stopVoice(){if('speechSynthesis' in window){window.speechSynthesis.cancel()}setSpeak(false);if(stopTimer)clearTimeout(stopTimer)}
function say(text){stopVoice();if(!('speechSynthesis' in window)){$('toast').textContent='このブラウザでは読み上げ非対応です。';return}try{const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.93;u.pitch=1.07;const voices=speechSynthesis.getVoices();const jp=voices.find(v=>(v.lang||'').toLowerCase().startsWith('ja'));if(jp)u.voice=jp;u.onstart=()=>setSpeak(true);u.onend=()=>setSpeak(false);u.onerror=()=>{setSpeak(false);$('toast').textContent='音声が出ない場合はSafariで開き直して試してね。'};speechSynthesis.speak(u);setSpeak(true);stopTimer=setTimeout(()=>setSpeak(false),Math.max(4000,text.length*250))}catch(e){setSpeak(false);$('toast').textContent='音声再生に失敗しました。メッセージは表示できます。'}}
$('form').addEventListener('submit',e=>{e.preventDefault();let t=$('message').value.trim();if(!t){$('toast').textContent='メッセージを入力してね。';return}addBubble('user',t);$('message').value='';const reply=getReply(t);addBubble('ai',reply);$('toast').textContent='送信できました（現在は定型返答です）';say(reply)});
$('daily').addEventListener('change',e=>{daily=e.target.checked;writePref('companion-daily',daily);showLook(daily?dayIndex():active)});
$('demo').addEventListener('click',()=>{let reply='こんにちは！今日の服装、どうかな？ ゆっくりお話ししようね。';addBubble('ai',reply);say(reply)});
$('emotion').addEventListener('click',()=>{emotionNo++;const texts=['うれしそうに微笑んでいます','考えるように少し傾いています','落ち着いて話を聞いています'];$('stateTitle').textContent=texts[emotionNo%3];$('stage').style.filter=emotionNo%3===0?'brightness(1.045) saturate(1.035)':emotionNo%3===1?'sepia(.045)':'none';$('toast').textContent='光や動きの簡易演出だけです。表情画像はまだ切り替えていません。';setTimeout(()=>{if(!$('stage').classList.contains('talking'))$('stateTitle').textContent='こんにちは'},2600)});
$('stop').addEventListener('click',()=>{stopVoice();$('toast').textContent='音声を停止しました。'});
setup();
</script></body></html>
