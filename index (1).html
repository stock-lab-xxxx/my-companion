<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6eeea">
<title>My Companion v0.6</title>
<style>
:root{
  --bg1:#fff9f6;--bg2:#f3e6e0;--panel:#fffffff0;--line:#ead8cf;--text:#382b2a;--sub:#7d6660;--accent:#b98570;--accent-soft:#f2e1d8;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--text);font-synthesis:none;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(165deg,var(--bg1),var(--bg2));min-height:100dvh}
.shell{width:min(100%,540px);margin:auto;padding:env(safe-area-inset-top) 14px max(24px,env(safe-area-inset-bottom))}
.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 2px 12px}
.heading h1{font-size:18px;margin:0 0 4px}
.subline{font-size:12px;color:var(--sub)}
.pill{background:#fff8;border:1px solid var(--line);font-size:11px;border-radius:999px;padding:7px 10px;white-space:nowrap}
.stage{position:relative;overflow:hidden;border-radius:24px;background:#dcc8be;box-shadow:0 18px 42px rgba(126,90,71,.16);aspect-ratio:3/3.72}
.photo{width:100%;height:100%;display:block;object-fit:cover;object-position:center 31%;position:absolute;inset:0;will-change:transform,opacity;transition:opacity .65s ease, transform .65s ease;animation:floaty 8s ease-in-out infinite alternate}
.photo.alt{opacity:0;transform:scale(1.03)}
.stage.swap .photo.main{opacity:0;transform:scale(1.03)}
.stage.swap .photo.alt{opacity:1;transform:scale(1)}
.stage.talking .photo{animation:talks 1.7s ease-in-out infinite alternate}
.overlay-top{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;gap:10px;z-index:2}
.badge{background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border:1px solid #f0e2d8;color:#5f4a45;border-radius:999px;padding:7px 10px;font-size:12px;box-shadow:0 4px 12px rgba(80,50,40,.07)}
.shade{position:absolute;inset:auto 0 0;height:33%;background:linear-gradient(transparent, rgba(33,19,18,.72));pointer-events:none;z-index:1}
.state{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.stateTitle{font-size:20px;font-weight:700;letter-spacing:.01em;margin-bottom:4px}
.stateDesc{font-size:13px;opacity:.95;line-height:1.45}
.now{margin-top:9px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:7px 10px;border-radius:999px;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#f1c5b0;box-shadow:0 0 0 0 rgba(241,197,176,.4)}
.dot.live{background:#7ce1a6;animation:pulse 1.5s infinite}
.panel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(84,54,44,.06)}
.section{padding:14px}
.section + .section{border-top:1px solid #efe1d7}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section h2{font-size:14px;margin:0 0 10px;color:#5f4741}
.scene-grid{display:grid;grid-template-columns:1fr;gap:10px}
.scene-btn{text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px 13px;box-shadow:0 5px 14px rgba(90,60,50,.04);transition:.2s ease;display:block;width:100%}
.scene-btn.active{border-color:var(--accent);background:linear-gradient(180deg,#fff,#fdf7f3);box-shadow:0 8px 18px rgba(185,133,112,.13)}
.scene-btn .name{font-size:15px;font-weight:700;margin-bottom:3px}
.scene-btn .meta{font-size:12px;color:var(--sub);line-height:1.45}
.small-btns{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{appearance:none;border:none;border-radius:14px;padding:11px 13px;font-size:14px;font-weight:700;color:white;background:linear-gradient(180deg,#d3a994,#b98570);box-shadow:0 8px 18px rgba(185,133,112,.25)}
.action-btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:none}
.info-card{background:linear-gradient(180deg,#fff,#fdf8f5);border:1px solid var(--line);border-radius:18px;padding:12px 13px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px;font-size:13px;line-height:1.45}
.kv + .kv{margin-top:6px}
.k{color:#8a7168}
.chat{display:flex;flex-direction:column;gap:10px}
.log{max-height:240px;overflow:auto;padding-right:2px}
.msg{display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:84%;padding:10px 12px;border-radius:16px;line-height:1.55;font-size:14px}
.msg.user .bubble{background:#f0ded6;color:#4b3932;border-bottom-right-radius:4px}
.msg.ai .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.input-wrap{display:flex;gap:8px}
.input-wrap input{flex:1;border-radius:14px;border:1px solid var(--line);padding:14px 14px;font-size:16px;background:#fff;color:var(--text)}
.send-btn{appearance:none;border:none;border-radius:14px;min-width:84px;padding:12px 12px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(180deg,#d3a994,#b98570);box-shadow:0 8px 18px rgba(185,133,112,.25)}
.footer-note{font-size:12px;color:var(--sub);line-height:1.55}
@keyframes floaty{0%{transform:scale(1) translate3d(0,0,0)}100%{transform:scale(1.05) translate3d(-2px,-8px,0)}}
@keyframes talks{0%{transform:scale(1.02) translateY(0)}50%{transform:scale(1.04) translateY(-2px)}100%{transform:scale(1.01) translateY(1px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,225,166,.4)}70%{box-shadow:0 0 0 8px rgba(124,225,166,0)}100%{box-shadow:0 0 0 0 rgba(124,225,166,0)}}
</style>
</head>
<body>
<div class="shell">
  <div class="heading">
    <div>
      <h1>My Companion v0.6</h1>
      <div class="subline">服装・髪型・表情・ポーズが大きく変わる試作版</div>
    </div>
    <div class="pill">無料デモ / GitHub Pages対応</div>
  </div>

  <div class="stage" id="stage">
    <img class="photo main" id="photoMain" alt="companion main">
    <img class="photo alt" id="photoAlt" alt="companion alt">
    <div class="overlay-top">
      <div class="badge" id="lookBadge">まとめ髪 × 白ニット</div>
      <div class="badge" id="moodBadge">親しみやすい微笑み</div>
    </div>
    <div class="shade"></div>
    <div class="state">
      <div class="stateTitle" id="sceneTitle">おうち相談</div>
      <div class="stateDesc" id="sceneDesc">頬に手を添えた、やさしい聞き役ポーズ</div>
      <div class="now"><span class="dot" id="liveDot"></span><span id="liveText">待機中</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="section">
      <div class="row-between"><h2>シーン切替</h2><div class="small-btns"><button class="action-btn secondary" id="dailyBtn">今日のおすすめ</button><button class="action-btn secondary" id="randomBtn">ランダム</button></div></div>
      <div class="scene-grid" id="sceneGrid"></div>
    </div>

    <div class="section">
      <h2>今のキャラクター設定</h2>
      <div class="info-card" id="sceneInfo"></div>
    </div>

    <div class="section chat">
      <div class="row-between"><h2>簡易会話デモ</h2><button class="action-btn secondary" id="demoBtn">デモ会話</button></div>
      <div class="log" id="log"></div>
      <div class="input-wrap">
        <input id="input" type="text" placeholder="相談やひとことを入力">
        <button class="send-btn" id="sendBtn">送信</button>
      </div>
      <div class="footer-note">※ まだ本物のAI接続ではなく、簡易ロジックです。<br>※ 次の段階で、表情差分の追加やAI接続を進められます。</div>
    </div>
  </div>
</div>

const stage=document.getElementById('stage');
const photoMain=document.getElementById('photoMain');
const photoAlt=document.getElementById('photoAlt');
const lookBadge=document.getElementById('lookBadge');
const moodBadge=document.getElementById('moodBadge');
const sceneTitle=document.getElementById('sceneTitle');
const sceneDesc=document.getElementById('sceneDesc');
const liveDot=document.getElementById('liveDot');
const liveText=document.getElementById('liveText');
const sceneGrid=document.getElementById('sceneGrid');
const sceneInfo=document.getElementById('sceneInfo');
const log=document.getElementById('log');
const input=document.getElementById('input');
const sendBtn=document.getElementById('sendBtn');
const demoBtn=document.getElementById('demoBtn');
const dailyBtn=document.getElementById('dailyBtn');
const randomBtn=document.getElementById('randomBtn');
let currentIndex=0;
let speaking=false;


function todayIndex(){
  const d=new Date();
  return (d.getFullYear()+d.getMonth()+d.getDate()) % scenes.length;
}

function renderSceneButtons(){
  sceneGrid.innerHTML='';
  scenes.forEach((scene, idx)=>{
    const btn=document.createElement('button');
    btn.className='scene-btn'+(idx===currentIndex?' active':'');
    btn.innerHTML=`<div class="name">${scene.name}</div><div class="meta">${scene.look}<br>${scene.mood}</div>`;
    btn.addEventListener('click',()=>setScene(idx,true));
    sceneGrid.appendChild(btn);
  });
}

function updateSceneInfo(scene){
  sceneInfo.innerHTML=`
    <div class="kv"><div class="k">髪・服</div><div>${scene.look}</div></div>
    <div class="kv"><div class="k">表情</div><div>${scene.mood}</div></div>
    <div class="kv"><div class="k">ポーズ</div><div>${scene.pose}</div></div>
    <div class="kv"><div class="k">雰囲気</div><div>${scene.name}モードで、相談しやすさを重視した演出</div></div>`;
}

function setScene(idx, save=true){
  currentIndex=idx;
  const scene=scenes[idx];
  const nextImg=scene.image;
  photoAlt.src=nextImg;
  stage.classList.add('swap');
  clearTimeout(window.__sceneSwitchTimer);
  window.__sceneSwitchTimer=setTimeout(()=>{
    photoMain.src=nextImg;
    stage.classList.remove('swap');
  }, 680);
  lookBadge.textContent=scene.look;
  moodBadge.textContent=scene.mood;
  sceneTitle.textContent=scene.name;
  sceneDesc.textContent=scene.pose;
  document.documentElement.style.setProperty('--accent', scene.accent);
  document.documentElement.style.setProperty('--accent-soft', scene.color);
  updateSceneInfo(scene);
  renderSceneButtons();
  if(save) localStorage.setItem('myCompanionScene', String(idx));
}

function setLive(text, on=false){
  liveText.textContent=text;
  liveDot.classList.toggle('live', on);
}

function addMessage(role,text){
  const wrap=document.createElement('div');
  wrap.className='msg '+role;
  const bubble=document.createElement('div');
  bubble.className='bubble';
  bubble.textContent=text;
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop=log.scrollHeight;
}

function getReply(text){
  const t=text.trim();
  const s=scenes[currentIndex];
  if(/仕事|職場|会社|上司/.test(t)) return `仕事の相談だね。${s.name}モードで落ち着いて整理しよう。まず、いちばん引っかかっている場面から聞かせて。`;
  if(/投資|株|NISA|お金/.test(t)) return `お金の相談だね。焦って決めるより、目的・期間・リスク許容度に分けると考えやすいよ。`;
  if(/疲れ|しんどい|つらい|眠い/.test(t)) return `今日は少し疲れていそうだね。無理に結論を急がず、今すぐ軽くできる対処から一緒に考えようか。`;
  if(/健康|筋トレ|運動|懸垂/.test(t)) return `健康や運動の話だね。続けやすさを優先しつつ、現実的な方法を一緒に整理してみよう。`;
  if(/こんにちは|はじめまして/.test(t)) return `こんにちは。今日は${s.look}の雰囲気で待ってたよ。どんなことを話したい？`;
  return `ありがとう。${s.name}の雰囲気で、ちゃんと聞くね。続けて話してくれたら、一緒に整理していくよ。`;
}

function speak(text){
  if(!('speechSynthesis' in window)) return fakeSpeak(text);
  window.speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang='ja-JP';
  utter.rate=1.0;
  utter.pitch=1.05;
  const voices=window.speechSynthesis.getVoices();
  const ja=voices.find(v=>/ja-JP|Japanese/i.test(v.lang));
  if(ja) utter.voice=ja;
  utter.onstart=()=>{speaking=true;stage.classList.add('talking');setLive('話しています',true);};
  utter.onend=()=>{speaking=false;stage.classList.remove('talking');setLive('待機中',false);};
  utter.onerror=()=>{speaking=false;stage.classList.remove('talking');setLive('待機中',false);};
  window.speechSynthesis.speak(utter);
}

function fakeSpeak(text){
  speaking=true;stage.classList.add('talking');setLive('話しています',true);
  setTimeout(()=>{speaking=false;stage.classList.remove('talking');setLive('待機中',false);}, Math.min(5000, 60*text.length));
}

function handleSend(){
  const text=input.value.trim();
  if(!text) return;
  addMessage('user',text);
  input.value='';
  setLive('考えています',true);
  const reply=getReply(text);
  setTimeout(()=>{
    addMessage('ai',reply);
    speak(reply);
  }, 420);
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });
demoBtn.addEventListener('click', ()=>{
  const lines=[
    '少し相談したいことがあるんだけど。',
    '今日は仕事のことでちょっと迷っていて。',
    '最近ちょっと疲れ気味かも。'
  ];
  const text=lines[(Date.now()%lines.length)];
  addMessage('user',text);
  setLive('考えています',true);
  const reply=getReply(text);
  setTimeout(()=>{addMessage('ai',reply);speak(reply);}, 380);
});

dailyBtn.addEventListener('click', ()=>setScene(todayIndex(), true));
randomBtn.addEventListener('click', ()=>setScene(Math.floor(Math.random()*scenes.length), true));

(function init(){
  const saved=localStorage.getItem('myCompanionScene');
  const idx=saved!==null ? Math.min(scenes.length-1, Math.max(0, Number(saved)||0)) : todayIndex();
  photoMain.src=scenes[idx].image;
  photoAlt.src=scenes[idx].image;
  setScene(idx, false);
  addMessage('ai','こんにちは。服装だけでなく表情やポーズも大きく変わるv0.6だよ。好きな雰囲気を選んでみてね。');
  setLive('待機中',false);
})();
</script>
